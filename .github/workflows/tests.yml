name: tests

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: yarn
      - run: yarn install --frozen-lockfile
      - run: yarn test:ci
      - name: Publish coverage summary
        run: |
          test -s coverage/coverage-summary.json
          test -s coverage/coverage-metadata.json
          node -e 'const c=require("./coverage/coverage-summary.json").total; require("fs").appendFileSync(process.env.GITHUB_STEP_SUMMARY,`### IDE rooms coverage\n\n| Statements | Branches | Functions | Lines |\n|---:|---:|---:|---:|\n| ${c.statements.pct}% | ${c.branches.pct}% | ${c.functions.pct}% | ${c.lines.pct}% |\n\n`)'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ide-rooms-coverage
          path: coverage
